# `name` is a guard in DSH patches, not a module replacement operation.
# Disable the stock provider and insert its subclass as the only active factory.
- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  disabled: true

- insert:
    - id: moss-agent-loop
      name: 'dsh-moss-live/agent-loop'
      config:
        agents: []
    - id: dsh-moss-live
      name: 'dsh-moss-live'
